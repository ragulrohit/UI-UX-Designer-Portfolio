<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Stackly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/404.css">
</head>
<body class="not-found-page">
    <main class="not-found-card">
        <a href="index.html" class="not-found-logo"><img src="images/Stackly_logo.png" alt="Stackly"></a>
        <div class="not-found-code">404</div>
        <h1>Page not found</h1>
        <p>The page or feature you tried to open is not available yet.</p>
        <div class="not-found-actions">
            <button type="button" class="not-found-button not-found-button--primary" id="goBackButton">Go Back</button>
            <a href="index.html" class="not-found-button not-found-button--secondary">Back to Home</a>
        </div>
    </main>
    <script>
        document.getElementById('goBackButton').addEventListener('click', function (event) {
            event.preventDefault();

            // Prevent duplicate navigation while the browser is changing pages.
            this.disabled = true;

            // The referrer is the actual page that opened this 404 page. Replacing
            // the current entry avoids relying on an unreliable history length.
            if (document.referrer) {
                window.location.replace(document.referrer);
            } else {
                window.location.replace('index.html');
            }
        });
    </script>
</body>
</html>
