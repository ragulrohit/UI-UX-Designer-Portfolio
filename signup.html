<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Stackly</title>
    <meta name="description" content="Create your Stackly portfolio dashboard account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body class="login-page signup-page">
    <div class="login-container">
        <div class="login-left" aria-hidden="true">
            <div class="login-shapes"><div class="login-shape login-shape--circle login-shape--circle-1"></div><div class="login-shape login-shape--circle login-shape--circle-2"></div><div class="login-shape login-shape--square login-shape--square-1"></div><div class="login-shape login-shape--ring login-shape--ring-1"></div></div>
            <div class="login-left-content">
                <div class="login-brand-icon"><img src="images/Stackly_logo.png" alt="Stackly"></div>
                <h2 class="login-left-title">Start Your Design Journey</h2>
                <p class="login-left-subtitle">Create an account and explore your creative workspace.</p>
            </div>
        </div>
        <div class="login-right">
            <a href="index.html" class="login-back-link" aria-label="Back to home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg><span>Back to Home</span></a>
            <div class="login-form-wrapper">
                <a href="index.html" class="login-logo-link" aria-label="Stackly - Home"><div class="login-logo"><span class="login-logo-mark"><img src="images/Stackly_logo.png" alt=""></span><span class="login-logo-word">STACKLY</span></div></a>
                <h1 class="login-heading">Create Account</h1>
                <p class="login-subtitle">Sign up to continue to your dashboard</p>
                <form class="login-form" id="signupForm" novalidate>
                    <div class="login-input-group" id="nameGroup"><label class="login-input-label" for="name">Full Name</label><div class="login-input-wrapper"><input type="text" id="name" class="login-input" placeholder="Enter your name" autocomplete="name"><div class="login-input-border"></div></div><span class="login-error-message">Name is required</span></div>
                    <div class="login-input-group" id="signupRoleGroup"><label class="login-input-label" for="signupRole">Select Role</label><div class="login-input-wrapper"><select id="signupRole" class="login-input login-role-select" autocomplete="off"><option value="">Choose your role</option><option value="designer">UI/UX Designer</option><option value="client">Client</option><option value="admin">Admin</option></select><div class="login-input-border"></div></div><span class="login-error-message">Please select your role</span></div>
                    <div class="login-input-group" id="signupEmailGroup"><label class="login-input-label" for="signupEmail">Email Address</label><div class="login-input-wrapper"><input type="email" id="signupEmail" class="login-input" placeholder="Enter your email" autocomplete="email"><div class="login-input-border"></div></div><span class="login-error-message">Email is required</span></div>
                    <div class="login-input-group" id="signupPasswordGroup"><label class="login-input-label" for="signupPassword">Password</label><div class="login-input-wrapper"><input type="password" id="signupPassword" class="login-input" placeholder="Create a password" autocomplete="new-password"><div class="login-input-border"></div><button type="button" class="login-password-toggle" id="toggleSignupPassword" aria-label="Show password"><svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div><span class="login-error-message">Password is required</span></div>
                    <div class="login-input-group" id="confirmPasswordGroup"><label class="login-input-label" for="confirmPassword">Confirm Password</label><div class="login-input-wrapper"><input type="password" id="confirmPassword" class="login-input" placeholder="Confirm your password" autocomplete="new-password"><div class="login-input-border"></div><button type="button" class="login-password-toggle" id="toggleConfirmPassword" aria-label="Show password"><svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div><span class="login-error-message">Passwords must match</span></div>
                    <button type="submit" class="login-submit-btn" id="signupBtn"><span class="login-submit-btn-text">Create Account</span><span class="login-submit-btn-spinner"></span></button>
                </form>
                <div class="login-footer"><p class="login-footer-text">Already have an account? <a href="login.html" class="login-footer-link">Login</a></p></div>
            </div>
        </div>
    </div>
    <div class="login-toast-container" id="toastContainer" aria-live="polite"></div>
    <div class="login-success-overlay" id="successOverlay"><div class="login-success-checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
    <script src="js/signup.js"></script>
    <script src="js/custom-select.js"></script>
</body>
</html>
