  <!-- Content -->
  <rect x="100" y="115" width="400" height="30" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="100" y="160" width="120" height="150" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="235" y="160" width="120" height="150" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="370" y="160" width="120" height="150" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="100" y="325" width="80" height="10" rx="5" fill="rgba(255,255,255,0.3)"/>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">E-Commerce Website</text>
</svg>