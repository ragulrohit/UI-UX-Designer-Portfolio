      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Browser Frame -->
  <rect x="80" y="60" width="440" height="280" rx="12" fill="rgba(255,255,255,0.1)"/>
  <rect x="80" y="60" width="440" height="35" rx="12" fill="rgba(255,255,255,0.15)"/>
  <circle cx="105" cy="77" r="5" fill="#ff5f57"/>
  <circle cx="125" cy="77" r="5" fill="#febc2e"/>
  <circle cx="145" cy="77" r="5" fill="#28c840"/>
  <!-- URL Bar -->
