<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Dashboard Frame -->
  <rect x="80" y="60" width="440" height="280" rx="12" fill="rgba(255,255,255,0.1)"/>
  <!-- Sidebar -->
  <rect x="80" y="60" width="80" height="280" rx="12" fill="rgba(255,255,255,0.15)"/>
  <circle cx="120" cy="100" r="12" fill="rgba(255,255,255,0.3)"/>
  <rect x="105" y="130" width="30" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="105" y="150" width="30" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="105" y="170" width="30" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="105" y="190" width="30" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <!-- Main Content -->
  <rect x="180" y="80" width="120" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="310" y="80" width="120" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="440" y="80" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
  <!-- Chart Area -->
  <rect x="180" y="160" width="320" height="160" rx="8" fill="rgba(255,255,255,0.15)"/>
  <polyline points="200,280 240,240 280,260 320,200 360,220 400,180 440,200 480,170" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">Analytics Dashboard</text>
</svg>