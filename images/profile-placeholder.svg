<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" rx="20"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="70" fill="url(#skin)"/>
  <!-- Hair -->
  <ellipse cx="200" cy="140" rx="75" ry="50" fill="#1a1a2e"/>
  <!-- Eyes -->
  <circle cx="175" cy="185" r="8" fill="#1a1a2e"/>
  <circle cx="225" cy="185" r="8" fill="#1a1a2e"/>
  <circle cx="177" cy="183" r="3" fill="white"/>
  <circle cx="227" cy="183" r="3" fill="white"/>
  <!-- Smile -->
  <path d="M175 210 Q200 235 225 210" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Body/Shirt -->
  <path d="M120 280 Q200 250 280 280 L300 500 L100 500 Z" fill="#1a1a2e"/>
  <!-- Collar -->
  <path d="M170 270 L200 300 L230 270" stroke="#8b5cf6" stroke-width="3" fill="none"/>
  <!-- Text -->
  <text x="200" y="450" text-anchor="middle" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="white" opacity="0.9">ARJUN MEHTA</text>
  <text x="200" y="475" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="white" opacity="0.7">UI/UX Designer</text>
</svg>